name: PARK-IT Trusted Server CI

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: park-it-server-ci-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  authorize:
    name: Authorize exact PR candidate
    if: >-
      ${{ github.event.issue.pull_request && startsWith(github.event.comment.body, '/server-ci ') && (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'COLLABORATOR') }}
    runs-on: [self-hosted, ci-vps]
    timeout-minutes: 5
    outputs:
      candidate_sha: ${{ steps.authorize.outputs.candidate_sha }}
    steps:
      - id: authorize
        name: Verify trusted exact current PR head
        uses: actions/github-script@v7
        with:
          script: |
            const allowed = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
            const association = context.payload.comment.author_association;
            if (!allowed.has(association)) {
              core.setFailed(`Untrusted author association: ${association}`);
              return;
            }

            const body = context.payload.comment.body.trim();
            const match = body.match(/^\/server-ci\s+([0-9a-f]{40})$/);
            if (!match) {
              core.setFailed('Use exactly: /server-ci <40-char-lowercase-sha>');
              return;
            }

            const candidate = match[1];
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            if (pr.state !== 'open') {
              core.setFailed('PR is not open');
              return;
            }
            if (pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed('External-fork PRs are not eligible for the server runner');
              return;
            }
            if (pr.user.login !== context.repo.owner) {
              core.setFailed(`Only repository-owner PRs may use this server runner: ${pr.user.login}`);
              return;
            }
            if (pr.head.sha !== candidate) {
              core.setFailed(`Candidate ${candidate} is not current PR head ${pr.head.sha}`);
              return;
            }

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: candidate,
              state: 'pending',
              context: 'canonical/server-ci',
              description: 'PARK-IT trusted self-hosted CI running',
            });

            core.setOutput('candidate_sha', candidate);

  p0-baseline:
    name: P0 safe legacy baseline
    needs: authorize
    runs-on: [self-hosted, ci-vps]
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.candidate_sha }}
          fetch-depth: 1

      - name: Verify exact candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.authorize.outputs.candidate_sha }}"

      - name: Runner and toolchain identity
        shell: bash
        run: |
          set -euo pipefail
          echo "repo=${GITHUB_REPOSITORY}"
          echo "sha=$(git rev-parse HEAD)"
          echo "runner=${RUNNER_NAME}"
          echo "os=${RUNNER_OS}"
          node --version
          npm --version

      - name: Repository governance baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f AGENTS.md
          if [ -f AGENT_READ_FIRST.md ]; then
            test -f MASTER_AUTONOMOUS_COMPLETION_PROTOCOL.md
            test -f AGENT_AUTONOMOUS_EXECUTION_CONTRACT.md
          fi

      - name: JavaScript syntax baseline
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check routes/index.js
          node --check bin/www

      - name: Block committed Google API credentials
        shell: bash
        run: |
          set -euo pipefail
          matches="$(git grep -n -E 'AIza[0-9A-Za-z_-]{25,}' -- ':!*.md' ':!*.txt' || true)"
          if [ -n "$matches" ]; then
            echo "::error::Google API credential pattern found in tracked source. Revoke/rotate it and move configuration to environment/secret storage."
            echo "$matches" | sed -E 's/(AIza)[0-9A-Za-z_-]+/\1[REDACTED]/g'
            exit 1
          fi

      - name: Legacy hygiene inventory
        shell: bash
        run: |
          set -euo pipefail
          tracked_node_modules="$(git ls-files 'node_modules/**' | wc -l | tr -d ' ')"
          echo "tracked_node_modules_files=${tracked_node_modules}"
          if [ ! -f package-lock.json ]; then
            echo "::warning::package-lock.json is absent; reproducible npm install remains a P0 gap."
          fi
          if [ "$tracked_node_modules" -gt 0 ]; then
            echo "::warning::node_modules is tracked; removal/migration remains a P0 gap."
          fi

      - name: Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check

  publish-canonical-status:
    name: Publish exact-SHA canonical result
    if: ${{ always() && needs.authorize.result == 'success' }}
    needs: [authorize, p0-baseline]
    runs-on: [self-hosted, ci-vps]
    timeout-minutes: 5
    steps:
      - name: Publish canonical/server-ci
        uses: actions/github-script@v7
        env:
          CANDIDATE_SHA: ${{ needs.authorize.outputs.candidate_sha }}
          P0_RESULT: ${{ needs.p0-baseline.result }}
        with:
          script: |
            const sha = process.env.CANDIDATE_SHA;
            const ok = process.env.P0_RESULT === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: ok ? 'success' : 'failure',
              context: 'canonical/server-ci',
              description: ok
                ? 'PARK-IT server CI P0 baseline green'
                : `PARK-IT server CI failed: ${process.env.P0_RESULT}`.slice(0, 140),
            });
            if (!ok) core.setFailed(`Canonical PARK-IT server CI failed: ${process.env.P0_RESULT}`);
